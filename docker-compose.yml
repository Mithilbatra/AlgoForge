name: algoforge
# Local development:  docker compose up -d db        (then run api, worker and web from source; see README)
# Everything in containers:  docker compose --profile full up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoforge
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-algoforge}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 2s
      retries: 30

  api:
    profiles: [full]
    build: {context: ./backend, target: api}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/algoforge
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-algoforge}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DUAL_MODE: ${AI_DUAL_MODE:-false}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-20}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATIONS_PER_15_MINUTES: ${REGISTRATIONS_PER_15_MINUTES:-5}
      LOGINS_PER_15_MINUTES: ${LOGINS_PER_15_MINUTES:-10}
      SUBMISSIONS_PER_MINUTE: ${SUBMISSIONS_PER_MINUTE:-10}
      RUNS_PER_MINUTE: ${RUNS_PER_MINUTE:-20}
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080"]

  worker:
    profiles: [full]
    build: {context: ./backend, target: worker}
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DATABASE_URL: jdbc:postgresql://db:5432/algoforge
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-algoforge}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DUAL_MODE: ${AI_DUAL_MODE:-false}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-20}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      WORKER_THREADS: ${WORKER_THREADS:-2}
    # The worker starts sibling sandbox containers through the host's Docker daemon. Access to this socket is
    # root-equivalent on the host: run the worker on a dedicated machine (see README, "Security model").
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on: {db: {condition: service_healthy}}

  web:
    profiles: [full]
    build: {context: ./frontend, args: {API_URL: "http://api:8080"}}
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata: {}
